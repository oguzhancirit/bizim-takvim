name: Telefon bildirimleri

# Her 5 dakikada bir bekleyen bildirimleri telefona gönderir.
# Not: GitHub zamanlanmış işleri bazen birkaç dakika geciktirebilir.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-notifications
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run push:send
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://bizim-takvim-48b62.firebaseapp.com/
